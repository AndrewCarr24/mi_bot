<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent_fin — sign in</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0e0e10;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    form {
      background: #1a1a1d;
      padding: 2rem 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      min-width: 300px;
    }
    h1 {
      margin: 0 0 1.25rem 0;
      font-size: 1.25rem;
      font-weight: 500;
    }
    label {
      display: block;
      font-size: 0.875rem;
      color: #888;
      margin-bottom: 0.5rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      box-sizing: border-box;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0e0e10;
      color: #e0e0e0;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #6c8eff;
    }
    button {
      width: 100%;
      padding: 0.6rem;
      background: #6c8eff;
      color: #0e0e10;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #8aa4ff;
    }
    .error {
      color: #ff7a7a;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <form method="POST" action="/login">
    <h1>agent_fin</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
